name: CI/CD - Desafio RH

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-backend:
    name: Backend - testes e imagem Docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v7

      - name: Configurar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Compilar e executar testes
        run: bash ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validar build da imagem Docker
        uses: docker/build-push-action@v7
        with:
          context: backend
          file: backend/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  ci-frontend:
    name: Frontend - lint e build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v7

      - name: Configurar Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Analisar código com ESLint
        run: npm run lint

      - name: Compilar frontend
        run: npm run build

  cd-backend:
    name: CD Backend - Docker Hub e Render
    needs: [ci-backend, ci-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-backend
    env:
      DOCKER_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v7

      - name: Validar configuração do backend
        shell: bash
        run: |
          if [ -z "$DOCKER_IMAGE" ] || [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ] || [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Configure DOCKERHUB_IMAGE e DOCKERHUB_USERNAME como Variables; DOCKERHUB_TOKEN e RENDER_DEPLOY_HOOK_URL como Secrets."
            exit 1
          fi

      - name: Autenticar no Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Publicar imagem do backend
        uses: docker/build-push-action@v7
        with:
          context: backend
          file: backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Publicar a nova imagem no Render
        shell: bash
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --get \
            --data-urlencode "imgURL=docker.io/${DOCKER_IMAGE}:${GITHUB_SHA}" \
            "$RENDER_DEPLOY_HOOK_URL"

  cd-frontend:
    name: CD Frontend - Vercel
    needs: [ci-backend, ci-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-frontend
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VITE_API_URL: ${{ vars.BACKEND_PUBLIC_URL }}

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v7

      - name: Configurar Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Validar configuração do frontend
        shell: bash
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ] || [ -z "$VITE_API_URL" ]; then
            echo "Configure VERCEL_TOKEN como Secret; VERCEL_ORG_ID, VERCEL_PROJECT_ID e BACKEND_PUBLIC_URL como Variables."
            exit 1
          fi

      - name: Instalar Vercel CLI
        run: npm install --global vercel@latest

      # O projeto Vercel usa Root Directory = frontend. A CLI parte da raiz
      # para evitar que a configuração resulte no caminho frontend/frontend.
      - name: Carregar configurações de produção
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Preparar build de produção
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Publicar frontend
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
